<title>El 7al Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a 390×844 phone on a sage desk with a screen index beside it; full-bleed app on phones. Single light look, matching the Paper file. */
:root{
  --paper:#F2F4EE;--surface:#FFFFFF;--ink:#0E2A1F;--muted:#5E7066;--line:#DAE1D3;--tile:#E8EEE1;
  --forest:#0D5C3A;--forest-2:#0F6B44;--forest-ink:#CFE3D6;--lime:#A3E635;--lime-ink:#12260A;--live:#65A30D;
  --steel:#B9C2BC;--steel-d:#8E9A93;--warn:#8A4B05;--warn-bg:#FDF0C8;--ok-bg:#D7EEDF;--danger:#B4232A;
  --desk:#D7DFD0;--desk-ink:#0E2A1F;--bezel:#0E2A1F;
  /* motion: tap / small / screen / celebrate, one easing family */
  --t1:150ms;--t2:250ms;--t3:350ms;--t4:700ms;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,.9,.3,1.25);
  --fd:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fa:"Cairo","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
.row>.btn{flex:1 1 0;width:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2.5px solid var(--lime);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px}
.phone-slot{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:410px;height:864px;border-radius:56px;background:var(--bezel);padding:10px;
  box-shadow:0 40px 80px -30px rgba(14,42,31,.45),0 0 0 1px rgba(14,42,31,.2);transform-origin:0 0}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--paper);isolation:isolate}
/* index */
.index{width:250px;max-height:86vh;overflow:auto;padding:4px 4px 12px;scrollbar-width:thin}
.index h2{font:800 22px/1.1 var(--fd);margin:0 0 4px;letter-spacing:-.01em}
.index p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.45}
.index h3{font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.index button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.index button:hover{background:rgba(255,255,255,.55)}
.index button[aria-current="true"]{background:var(--forest);color:#fff}
.idx-toggle,.index .idx-close{display:none}
@media (max-width:760px){
  body{padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:var(--paper)}
  .stage{display:block}
  .phone-slot{width:100%!important;height:100%!important}
  .phone{position:relative;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;transform:none!important;background:var(--paper)}
  .screen{width:100%;height:100%;border-radius:0}
  .index{position:fixed;inset:0;width:auto;max-height:none;z-index:50;background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 30px;transform:translateX(-102%);transition:transform .3s ease}
  .index.open{transform:none}
  .idx-toggle{display:grid;place-items:center;position:fixed;z-index:40;right:calc(env(safe-area-inset-right,0px) + 4px);top:44%;width:28px;height:28px;border-radius:999px;background:rgba(14,42,31,.4);color:#fff;font:700 13px var(--fb)}
  .index .idx-close{display:block;position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border-radius:999px;background:var(--tile);font-weight:800}
  .sb .sbin{visibility:hidden}
  .sb{height:max(14px,env(safe-area-inset-top,0px))!important}
}
/* ---------- app ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.scr.forest{background:var(--forest)}
.scr.map{background:#E6EBE2}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.sb{height:54px;flex:none;color:#000}
.sb .sbin{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 34px 0 56px}
.sb .t{font:600 16px/1 -apple-system,"SF Pro Text",var(--fb);letter-spacing:-.01em}
.on-dark .sb,.sb.dk{color:#fff}
.h1{font:800 32px/1.05 var(--fd);letter-spacing:-.015em;color:var(--ink);margin:0;text-wrap:balance}
.h1.w{color:#fff}
.sub{font-size:15px;color:var(--muted);line-height:1.45;margin:0}
.lbl{font:600 13px var(--fb);color:var(--muted)}
.cap{font:700 12px var(--fb);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g18{gap:18px}
.f1{flex:1;min-width:0}
.pad{padding-left:20px;padding-right:20px}
.btn{height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px var(--fb);width:100%;transition:transform .12s ease,background .2s,opacity .2s;flex:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--forest);color:#fff}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.ghw{border:1.5px solid rgba(255,255,255,.4);color:#fff}
.btn.out{border:1px solid var(--line);color:var(--forest);background:transparent}
.btn.soft{background:var(--tile);color:var(--forest)}
.btn.dng{border:1.5px solid var(--danger);color:var(--danger)}
.btn.off{background:var(--tile);color:var(--steel-d);pointer-events:none}
.btn.sm{height:50px;font-size:15px}
.link{font:700 14px var(--fb);color:var(--forest)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.ib{width:42px;height:42px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .12s}
.ib:active{transform:scale(.92)}
.ib.dk{background:rgba(255,255,255,.12);border:0}
.ib.fo{background:var(--forest);border:0}
.ib.ti{background:var(--tile);border:0}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 0;min-height:46px;flex:none}
.brand{display:flex;align-items:center;gap:6px;font:800 18px var(--fd);color:#fff}
.brand b{font-size:22px;color:var(--lime)}
.field{display:flex;flex-direction:column;gap:6px}
.inp{height:54px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:0 16px;font:16px var(--fb);color:var(--ink);width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--forest);box-shadow:0 0 0 1px var(--forest)}
.inpw{position:relative}
.inpw .inp{padding-right:48px}
.inpw .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center}
textarea.inp{height:150px;padding:16px;line-height:1.45;resize:none;border-radius:20px}
.chip{height:36px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font:600 13px var(--fb);color:var(--muted);flex:none}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:700}
.badge{height:26px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;font:700 12px var(--fb);flex:none;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--forest)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-mut{background:var(--tile);color:var(--muted)}.b-dng{background:rgba(180,35,42,.1);color:var(--danger)}
.b-live{background:rgba(163,230,53,.25);color:#3F6212;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none}
.dot.lime{background:var(--lime)}
.pulse{position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;animation:pulse 2s ease-out infinite;will-change:transform,opacity}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--tile) 25%,#F7F9F4 50%,var(--tile) 75%);background-size:200% 100%;animation:skel 1.1s linear infinite}
@keyframes skel{from{background-position:120% 0}to{background-position:-80% 0}}
[data-skel].loading>*{display:none!important}
[data-skel].loading>.skw{display:flex!important}
.offb{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:var(--ink);color:#fff;font:600 12px var(--fb);white-space:nowrap;animation:tin var(--t3) var(--ease) both;box-shadow:0 8px 20px rgba(14,42,31,.25)}
.err{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(180,35,42,.08);color:var(--danger);font:600 13px/1.4 var(--fb)}
.inp.bad{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.door.shiver .dframe{animation:shake .4s}
.actbar{margin:0 16px;height:56px;border-radius:999px;background:var(--forest);display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;color:#fff;text-align:left;box-shadow:0 10px 24px rgba(13,92,58,.28);animation:up var(--t3) var(--spring) both}
.up-tile{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:center}
.up-tile .ph{height:96px;border-radius:16px;border:1.5px dashed var(--steel);background:var(--surface);display:grid;place-items:center;transition:border-color var(--t2),background var(--t2)}
.up-tile.on .ph{border:1.5px solid var(--forest);background:var(--tile)}
.livechip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(163,230,53,.16);font:700 12px var(--fb);letter-spacing:.06em;color:var(--lime)}
.av{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font:800 17px var(--fd);flex:none;background:var(--tile);color:var(--forest)}
.av.fo{background:var(--forest);color:var(--lime)}
.av.li{background:var(--lime);color:var(--forest)}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .4s}
.steps i.on{background:var(--forest)}
.steps i.now{background:var(--lime)}
.steps.dk i{background:rgba(255,255,255,.18)}.steps.dk i.on{background:var(--lime)}
.steps.dk i.now{background:linear-gradient(90deg,var(--lime) 50%,rgba(255,255,255,.18) 50%)}
.tabs{flex:none;display:flex;justify-content:space-around;padding:14px 8px 30px;border-top:1px solid var(--line);background:var(--paper)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--fb);color:var(--muted);min-width:64px}
.tab.on{color:var(--forest);font-weight:700}
.tab svg{transition:transform .25s}
.tab.on svg{transform:translateY(-1px)}
.sheet{background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(14,42,31,.08);flex:none}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);animation:tin .3s both;z-index:30;background:var(--ink);color:#fff;font:600 14px var(--fb);padding:12px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 24px rgba(14,42,31,.3);pointer-events:none}
.tool{display:block}
/* slide to act */
.sl{position:relative;height:66px;border-radius:999px;background:var(--forest);display:flex;align-items:center;padding:6px;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;flex:none}
.sl .fill{position:absolute;left:6px;top:6px;bottom:6px;width:calc(100% - 12px);border-radius:999px;background:rgba(163,230,53,.2);transform:translateX(-100%);will-change:transform}
.sl .knob{will-change:transform}
.sl .knob{position:relative;z-index:2;width:54px;height:54px;border-radius:999px;background:var(--lime);display:grid;place-items:center;cursor:grab;flex:none}
.sl .knob:active{cursor:grabbing}
.sl .txt{position:absolute;left:76px;right:18px;display:flex;align-items:center;gap:6px;font:600 15px var(--fb);color:var(--forest-ink);white-space:nowrap;overflow:hidden;pointer-events:none}
.sl .txt b{color:#fff;font-weight:800}
.shimmer{background:linear-gradient(90deg,#CFE3D6 0%,#CFE3D6 40%,#fff 50%,#CFE3D6 60%,#CFE3D6 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shim 2.4s linear 2}
.shimmer b{color:transparent!important}
@keyframes shim{from{background-position:120% 0}to{background-position:-130% 0}}
.chev{display:flex;gap:2px;margin-left:auto}
.chev svg:nth-child(1){animation:chv 1.4s 3}.chev svg:nth-child(2){animation:chv 1.4s .2s 3}
@keyframes chv{0%,100%{opacity:.25}50%{opacity:.9}}

/* welcome */
.wtop{padding:8px 24px 0;display:flex;flex-direction:column;gap:18px;flex:none}
.prog{display:flex;gap:6px}
.prog button{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);transition:background .35s}
.prog button.on{background:var(--lime)}
.archip{height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font:700 13px var(--fa);color:#fff}
.onb{flex:1;min-height:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.otrack{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.oslide{flex:0 0 100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 28px}
.otitle{font:800 48px/1 var(--fd);letter-spacing:-.02em;color:#fff;text-align:center}
.otxt{font-size:16px;color:var(--forest-ink);text-align:center;margin-top:-14px}
.wact{flex:none;display:flex;flex-direction:column;gap:10px;padding:0 20px 34px}
.urg{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;font:600 14px var(--fb);color:var(--forest-ink)}
.orbit{position:relative;width:300px;height:300px}
.ring{position:absolute;inset:30px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.22)}
.glow{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(163,230,53,.35),rgba(163,230,53,0) 70%);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.logo7{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:26px;background:var(--lime);display:grid;place-items:center;font:800 64px/1 var(--fd);color:var(--forest);box-shadow:0 0 0 12px rgba(163,230,53,.12)}
.spin{position:absolute;inset:0;animation:rot 36s linear infinite}
.spin .ot{position:absolute;left:50%;top:50%;width:40px;height:64px;margin:-32px 0 0 -20px}
.spin .ot .up{width:100%;height:100%;animation:rot 36s linear infinite reverse}
.spin .ot .sw{width:100%;height:100%;transform-origin:50% 8%;animation:swing 2.6s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.drop{animation:drip 1.8s ease-in infinite}
.drop.d2{animation-delay:.6s}.drop.d3{animation-delay:1.2s}
@keyframes drip{0%{transform:translateY(-14px);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.ckpop{transform-origin:196px 172px;animation:ckpop 2.4s cubic-bezier(.2,.9,.3,1.4) infinite}
@keyframes ckpop{0%,15%{transform:scale(0)}35%,85%{transform:scale(1)}100%{transform:scale(1)}}
.idcard{transform-origin:133px 118px;animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(-4deg)}}
.route{stroke-dashoffset:0;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.pinb{transform-origin:160px 116px;animation:pinb 1.6s ease-in-out infinite}
@keyframes pinb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pring{transform-origin:160px 78px;animation:pring 2s ease-out infinite}
@keyframes pring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* auth header */
.ahead{flex:none;background:var(--forest);border-radius:0 0 32px 32px;overflow:hidden;display:flex;flex-direction:column;position:relative;z-index:3}
.door{position:relative;height:200px;margin-top:14px}
.door .floor{position:absolute;left:50px;right:50px;bottom:10px;height:2px;border-radius:2px;background:rgba(255,255,255,.14)}
.dframe{position:absolute;bottom:10px;width:112px;height:184px;border-radius:5px;background:#0A4A2E;padding:6px 6px 0;perspective:520px}
.dins{position:absolute;left:6px;right:6px;top:6px;bottom:0;background:radial-gradient(ellipse at 50% 58%,#D9F99D 0%,#A3E635 55%,#6FA61E 100%);overflow:hidden}
.dins .dt{position:absolute;left:50%;bottom:6px;width:38px;height:62px;margin-left:-6px}
.dleaf{position:absolute;left:6px;right:6px;top:6px;bottom:0;background:#0F6B44;border:2px solid #06140D;transform-origin:left center;transform:rotateY(0deg);backface-visibility:visible}
.dleaf .pn{position:absolute;left:10%;right:10%;border:1.5px solid rgba(6,20,13,.35)}
.dleaf .pn1{top:8%;height:34%}.dleaf .pn2{top:50%;height:42%}
.dleaf .kh{position:absolute;right:9px;top:48%;width:8px;height:16px}
.dleaf .kh::before{content:"";position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;background:#06140D}
.dleaf .kh::after{content:"";position:absolute;left:2.5px;top:6px;width:3px;height:8px;border-radius:2px;background:#06140D}
.dleaf .slot{position:absolute;left:24%;right:24%;top:62%;height:8px;border-radius:3px;background:rgba(6,20,13,.55)}
.spill{position:absolute;bottom:0;height:16px;background:linear-gradient(180deg,rgba(163,230,53,.5),rgba(163,230,53,0));clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);opacity:0}
.dkey{position:absolute;width:62px;height:22px}
/* login door: plays once on arrival, then rests open */
.door.loop .dleaf{animation:dopenO 3s .25s var(--ease) both}
.door.loop .dkey{animation:dkeyO 3s .25s var(--ease) both}
.door.loop .spill{animation:spillO 3s .25s ease-out both}
.door.loop .dt{animation:dtool 1.6s 2.9s ease-in-out both}
@keyframes dkeyO{0%{transform:translateX(70px);opacity:0}12%{opacity:1}32%{transform:translateX(0) rotate(0)}48%{transform:translateX(0) rotate(90deg);opacity:1}58%,100%{transform:translateX(0) rotate(90deg);opacity:0}}
@keyframes dopenO{0%,52%{transform:rotateY(0)}88%,100%{transform:rotateY(74deg)}}
@keyframes spillO{0%,55%{opacity:0}90%,100%{opacity:1}}
@keyframes dtool{0%,58%{transform:translateY(0) rotate(0)}64%{transform:translateY(-8px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}76%{transform:translateY(-4px) rotate(-3deg)}82%,100%{transform:none}}
.door.opening .dleaf{animation:dopen1 1.4s .3s cubic-bezier(.4,0,.2,1) forwards}
.door.opening .spill{animation:spill1 1.4s .3s forwards}
.door.opening .dt{animation:dtool 3s 1.2s ease-in-out infinite}
@keyframes dopen1{to{transform:rotateY(74deg)}}
@keyframes spill1{to{opacity:1}}
.env{position:absolute;width:96px;height:66px;animation:envfly 3.2s cubic-bezier(.3,.7,.3,1) infinite}
@keyframes envfly{0%{transform:translate(-150px,30px) rotate(-18deg);opacity:0}15%{opacity:1}55%{transform:translate(0,0) rotate(-6deg)}70%{transform:translate(0,0) rotate(-6deg);opacity:1}85%{transform:translate(52px,22px) rotate(0) scale(.35);opacity:0}100%{opacity:0}}
.speed{animation:speed 3.2s infinite}
@keyframes speed{0%,10%{opacity:0;transform:translateX(-20px)}30%{opacity:.6;transform:none}55%,100%{opacity:0}}
.kp{transition:fill .3s,stroke-dasharray .3s,opacity .3s}
.kp.on{animation:kpop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes kpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.keyb{transition:transform .7s cubic-bezier(.5,0,.2,1)}
.keyb.go{transform:translateX(54px)}
.code{display:flex;gap:12px}

function confetti(){if(reduce)return;const c=document.createElement("canvas");c.className="confetti";const W=app.clientWidth,H=app.clientHeight;c.width=W*2;c.height=H*2;app.appendChild(c);const x=c.getContext("2d");x.scale(2,2);
  const cols=["#A3E635","#0D5C3A","#FFFFFF","#CFE3D6","#12260A"];const P=Array.from({length:90},()=>({x:W/2,y:H*.62,vx:(Math.random()-.5)*11,vy:-Math.random()*13-5,r:Math.random()*6,va:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*5,c:cols[Math.random()*cols.length|0],o:Math.random()<.3}));

function bindSlide(el,onDone){if(!el)return;const k=el.querySelector(".knob"),fill=el.querySelector(".fill"),txt=el.querySelector(".txt");let sx=null,p=0,max=0,done=false,fw=0;

 const f=el.querySelector("#sf");f.addEventListener("focusin",()=>{paused=true;st.style.transition="opacity var(--t3)";st.style.opacity=".55";});f.addEventListener("focusout",()=>{paused=false;st.style.opacity="1";});
 const MOVES=[[{transform:"rotate(0)"},{transform:"rotate(-22deg)"},{transform:"rotate(18deg)"},{transform:"rotate(-10deg)"},{transform:"rotate(0)"}],
  [{transform:"translateY(0) rotate(0)"},{transform:"translateY(-6px) rotate(180deg)"},{transform:"translateY(0) rotate(360deg)"}],
  [{transform:"rotate(0)"},{transform:"rotate(-40deg)"},{transform:"rotate(-40deg)"},{transform:"rotate(0)"}],
  [{transform:"rotate(0)"},{transform:"rotate(90deg)"},{transform:"rotate(90deg)"},{transform:"rotate(0)"}]];
 const cyc=()=>{if(!alive||!st.isConnected)return;if(paused){later(400,cyc);return;}const t=tl[i],dx=195-xs[i];t.classList.add("act");
  t.animate([{transform:"none"},{transform:`translate(${dx}px,-54px) scale(1.8)`}],{duration:1000,easing:"cubic-bezier(.3,.8,.3,1)",fill:"forwards"});
  circ.animate([{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:1000,easing:"cubic-bezier(.3,.8,.3,1.2)",fill:"forwards"});
  later(1000,()=>{t.querySelector(".lti").animate(MOVES[i],{duration:1000,easing:"ease-in-out"});});
  later(2000,()=>{t.animate([{transform:`translate(${dx}px,-54px) scale(1.8)`},{transform:"none"}],{duration:1000,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"});circ.animate([{transform:"scale(1)",opacity:1},{transform:"scale(0)",opacity:0}],{duration:900,fill:"forwards"});});
  later(3000,()=>{t.classList.remove("act");i=(i+1)%4;});

 later(300,cyc);}

def("fp2",{t:"Mot de passe oublié · Code",g:"Accès"},()=>fpForm(2,`<h1 class="h1" style="padding-top:6px">Le code</h1><p class="sub">Envoyé à samir@gmail.com · essayez 4721</p>

 el=>{const ins=[...el.querySelectorAll("[data-ci]")],parts=[...el.querySelectorAll(".kp")];let s=42;every(1000,()=>{const r=el.querySelector("#resend");if(r&&s>0){s--;r.textContent=`Renvoyer dans 0:${String(s).padStart(2,"0")}`;}});
  const upd=()=>{const v=ins.map(i=>i.value).join("");parts.forEach((p,j)=>{const on=j<v.length;if(j===0)return;p.classList.toggle("on",on);p.setAttribute("fill",on?"#A3E635":"none");p.setAttribute("stroke",on?"#06140D":"#A3E635");p.setAttribute("stroke-dasharray",on?"0":"4 3");p.setAttribute("stroke-width",on?"2.2":"2");});
   ins.forEach(i=>i.classList.toggle("full",!!i.value));const b=el.querySelector("#vbtn");b.className="btn "+(v.length===4?"pri":"off");if(v.length===4){if(v==="4721"){ins.forEach(i=>i.blur());el.querySelector("#keyb").classList.add("go");haptic(14);later(900,()=>go("fp3"));}
    else{tries--;const c=el.querySelector("#code");c.classList.remove("bad");void c.offsetWidth;c.classList.add("bad");haptic(30);const er=el.querySelector("#cerr");er.hidden=false;er.querySelector("span").textContent=`Code incorrect. Il reste ${tries} essai${tries>1?"s":""}.`;
     later(450,()=>{ins.forEach(i=>i.value="");upd();ins[0].focus();});}}else if(v.length)el.querySelector("#cerr").hidden=true;};
  let tries=3;

   inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!inp.value&&ins[i-1]){ins[i-1].focus();ins[i-1].value="";upd();}});
   inp.addEventListener("paste",e=>{const t=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,4);if(t){e.preventDefault();t.split("").forEach((c,j)=>ins[j].value=c);upd();}});});

  later(450,()=>{if(matchMedia("(min-width:761px)").matches)ins[0].focus();});});

 el=>{const path=el.querySelector("#route"),mk=el.querySelector("#mk"),L=path.getTotalLength(),dur=reduce?300:9000,t0=performance.now();let raf,phase=2,done=false;
  const stepUI=(n)=>{phase=n;const st=[...el.querySelectorAll("#tsteps i")];st.forEach((x,i)=>x.className=i<n?"on":i===n?"now":"");el.querySelector("#tnum").textContent=`${Math.min(6,n+1)} / 6`;

function reqCard(){if(!S.online)return `<div class="empty">Vous êtes hors ligne. Activez « En ligne » pour recevoir des demandes.</div>`;
 if(S.reqGone)return `<div class="empty"><span class="row g8" style="justify-content:center"><span class="dot pulse"></span>En attente de nouvelles demandes…</span></div>`;
 return `<div class="col g14"><span class="row g8 cap"><span class="dot pulse"></span>Nouvelle demande</span><div class="col g14 fadein" style="padding:18px;border-radius:24px;background:var(--surface);border:2px solid var(--lime);box-shadow:0 8px 22px rgba(13,92,58,.12)">
 <div class="row g14" style="align-items:flex-start"><span class="ib ti" style="width:52px;height:52px;border-radius:16px">${tool("plomb","light",24,38)}</span><span class="col f1" style="gap:3px"><b style="font-size:17px;font-weight:800">Fuite sous l'évier</b><span style="font-size:13px;color:var(--muted)">Samir · La Marsa · 1,2 km</span></span><span class="col" style="align-items:flex-end"><b id="rt" style="font:800 22px/1 var(--fd);font-variant-numeric:tabular-nums">0:24</b><span style="font-size:11px;color:var(--muted)">pour répondre</span></span></div>
 <div class="row g10"><button class="btn out sm" style="flex:1;color:var(--muted)" data-act="refuseReq">Refuser</button><button class="btn pri sm" style="flex:2" data-act="acceptReq">Accepter</button></div></div></div>`;}
function startReqTimer(el){let s=24;const tick=()=>{const t=el.querySelector("#rt");if(!t)return;s--;if(s<=0){S.reqGone=true;refreshReq(el);later(5000,()=>{S.reqGone=false;refreshReq(el);});return;}t.textContent=`0:${String(s).padStart(2,"0")}`;t.style.color=s<=8?"var(--danger)":"";};every(1000,tick);}
function refreshReq(el){const z=el.querySelector("#reqzone");if(z)z.innerHTML=reqCard();}

 <div class="row between" style="align-items:flex-end;padding:16px 20px 0"><h1 class="h1 w fadein" style="font-size:30px">${m[0]}</h1>${S.mstep===0?`<div class="row g6" style="align-items:baseline"><b style="font:800 30px/1 var(--fd);color:var(--lime)">8</b><span style="font:600 13px var(--fb);color:var(--forest-ink)">min</span></div>`:""}</div>

 <div class="sheet col g14" style="padding:20px 20px 30px"><span class="grab"></span>
 <div class="row g12"><div class="av" style="width:50px;height:50px;font-size:19px">S</div><div class="col f1" style="gap:3px"><b style="font-size:17px;font-weight:800">Samir B.</b><span style="font-size:13px;color:var(--muted)">Fuite sous l'évier · 1,2 km</span></div><button class="ib ti" style="width:46px;height:46px" data-go="chat" aria-label="Écrire à Samir">${ic("chat","#0D5C3A",20)}</button><button class="ib fo" style="width:46px;height:46px" data-toast="Appel : +216 22 345 678" aria-label="Appeler Samir">${PHONE}</button></div>

 ${slider("msl","Glissez ·",m[3])}</div></div>`;},
 el=>{const path=el.querySelector("#route"),mk=el.querySelector("#mk"),L=path.getTotalLength();const p0=S.mstep===0?0:1;let raf;const t0=performance.now();
  const f=now=>{const p=S.mstep===0?Math.min(.85,(now-t0)/12000):1;const pt=path.getPointAtLength(L*Math.max(p0,p));mk.setAttribute("transform",`translate(${pt.x} ${pt.y})`);if(p<.85)raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);cleanup.push(()=>cancelAnimationFrame(raf));
  bindSlide(el.querySelector("#msl"),()=>{if(S.mstep<2){S.mstep++;go("mission","swap");}else{S.mstep=0;go("amount");}});});

 `<svg width="390" height="250" viewBox="0 0 390 250" fill="none" aria-hidden="true"><path d="M60 30H330" stroke="#fff" stroke-opacity=".14" stroke-width="3" stroke-linecap="round"/><g opacity=".4" transform="translate(64 26) scale(.5)"><g style="transform-origin:50px 14px;animation:swing 3s ease-in-out infinite">${TOOLS.plomb.split("var(--color-forest)").join("#A3E635").split("var(--color-steel-dark)").join("#A9B8AF").split("var(--color-steel)").join("#DDE5DF").split("var(--color-ink)").join("#06140D").split("var(--color-tile)").join("#0D5C3A")}</g></g><g opacity=".4" transform="translate(276 26) scale(.5)"><g style="transform-origin:50px 14px;animation:swing 3.4s ease-in-out infinite">${TOOLS.serr.split("var(--color-forest)").join("#A3E635").split("var(--color-steel-dark)").join("#A9B8AF").split("var(--color-steel)").join("#DDE5DF").split("var(--color-ink)").join("#06140D").split("var(--color-tile)").join("#0D5C3A")}</g></g><circle cx="195" cy="140" r="92" fill="#fff" fill-opacity=".05"/><circle cx="195" cy="140" r="66" fill="#fff" fill-opacity=".08"/><g style="transform-origin:195px 140px;animation:rot 3s linear infinite"><circle cx="195" cy="140" r="66" stroke="#A3E635" stroke-width="5" stroke-linecap="round" stroke-dasharray="120 300"/></g><rect x="174" y="114" width="14" height="52" rx="5" fill="#fff"/><rect x="202" y="114" width="14" height="52" rx="5" fill="#fff"/></svg>`;}
function pauseScreen(refused){return `<div class="scr forest">${sb(1)}<div class="navrow">${backBtn(1)}<span></span><span style="width:42px"></span></div><div class="row" style="justify-content:center;flex:none">${pauseScene(refused)}</div>
 <div class="col g8" style="align-items:center;padding:8px 28px 0;flex:none"><h1 class="h1 w">${refused?"Preuve refusée":"Compte en pause"}</h1><p style="margin:0;font-size:15px;line-height:1.45;color:var(--forest-ink);text-align:center">${refused?"Le montant du reçu ne correspond pas. Envoyez une nouvelle photo pour réactiver votre compte.":"Vous recevrez à nouveau des demandes dès que votre virement est validé."}</p></div>

  <div class="row g14" style="align-items:flex-start"><span class="col" style="align-items:center"><span class="ib" style="width:26px;height:26px;border:0;background:${refused?"rgba(180,35,42,.15)":"rgba(163,230,53,.3)"}"><span class="${refused?"":"pulse"}" style="width:12px;height:12px;border-radius:999px;background:${refused?"var(--danger)":"var(--live)"}"></span></span><span style="width:2px;height:22px;background:var(--line)"></span></span><span class="row between f1" style="padding-top:3px"><b style="font-size:15px">${refused?"Reçu : 250 TND au lieu de "+(S.lastDue||300):"Vérification par El 7al"}</b><span style="font:600 13px var(--fb);color:${refused?"var(--danger)":"#4D7C0F"}">${refused?"Refusée":"En cours"}</span></span></div>

 <div class="body col g12" style="padding:16px 20px 20px">

function docThumb(kind,ok,label){return `<div class="col f1" style="gap:6px"><div style="height:70px;border-radius:12px;background:var(--tile);display:flex;flex-direction:column;gap:5px;padding:10px;${kind===2?"align-items:center;justify-content:center":""}">${kind===0?'<i style="width:18px;height:18px;border-radius:999px;background:var(--steel)"></i><i style="height:4px;border-radius:2px;background:var(--steel)"></i><i style="height:4px;width:70%;border-radius:2px;background:var(--steel)"></i>':kind===1?'<i style="height:4px;border-radius:2px;background:var(--steel)"></i><i style="height:4px;border-radius:2px;background:var(--steel)"></i><i style="height:4px;width:60%;border-radius:2px;background:var(--steel)"></i><i style="height:10px;width:50%;border-radius:3px;background:var(--steel-d)"></i>':'<i style="height:6px;width:60%;border-radius:3px;background:var(--forest)"></i><i style="height:4px;width:80%;border-radius:2px;background:var(--steel)"></i><i style="width:16px;height:16px;border-radius:999px;border:2px solid var(--steel-d)"></i>'}</div><span class="row g6" style="font:600 11px var(--fb);color:${ok?"var(--ink)":"var(--warn)"}">${ok?ic("check","#0D5C3A",12,3.4):'<span class="dot" style="width:8px;height:8px;background:var(--warn)"></span>'}${label}</span></div>`;}
def("verifs",{t:"Vérifications",g:"Admin",tabs:"admin"},()=>{const v=S.verifs;return `<div class="scr">${adminHead("Vérifications")}<div class="body col g12" style="padding:16px 20px 20px">
 ${v.length?`<div class="col g14 fadein" style="padding:16px;border-radius:24px;background:var(--surface);border:1.5px solid var(--forest);box-shadow:0 8px 22px rgba(14,42,31,.08)"><div class="row g12"><div class="av">${v[0].a}</div><div class="col f1" style="gap:2px"><b style="font-size:16px;font-weight:800">${v[0].n}</b><span style="font-size:13px;color:var(--muted)">${v[0].t}</span></div></div>
 <div class="row g8">${docThumb(0,1,"CIN recto")}${docThumb(1,1,"CIN verso")}${docThumb(2,0,"Diplôme")}</div>
 <div class="row g10"><button class="btn dng sm" style="flex:1" data-act="vRefuse">Refuser</button><button class="btn pri sm" style="flex:1.6" data-act="vOk">Valider l'artisan</button></div></div>

def("payments",{t:"Paiements",g:"Admin",tabs:"admin"},()=>{const l=pendingProofs();const p=l[0];return `<div class="scr">${adminHead("Paiements")}
 <div class="row g8" style="padding:14px 20px 0;flex:none"><span class="chip on">À vérifier ${l.length?`<span class="badge" style="height:20px;min-width:20px;padding:0 6px;justify-content:center;background:var(--lime);color:var(--lime-ink);font-size:11px">${l.length}</span>`:""}</span><span class="chip">Validés</span><span class="chip">Refusés</span></div>

  <div class="row g12"><div class="av fo">${p.a}</div><div class="col f1" style="gap:2px"><b style="font-size:16px;font-weight:800">${p.n}</b><span style="font-size:13px;color:var(--muted)">${p.t}</span></div><span class="badge b-warn">EN PAUSE</span></div>

  <div class="col f1 g12" style="justify-content:center"><div class="col" style="gap:2px"><span class="lbl" style="font-size:12px">Montant attendu</span><span class="row g6" style="align-items:baseline"><b style="font:800 32px/1 var(--fd)">${p.m*30}</b><b style="font:800 15px var(--fd);color:var(--muted)">TND</b></span></div><div class="col" style="gap:2px"><span class="lbl" style="font-size:12px">Calcul</span><b style="font-size:14px">${p.m} missions × 30 TND</b></div></div></div>
  <div class="row g10"><button class="btn dng sm" style="flex:1" data-act="pRefuse">Refuser</button><button class="btn pri sm" style="flex:1.6" data-act="pOk">Valider</button></div></div>
  ${l.slice(1).map(x=>`<div class="row g12 card" style="padding:14px 16px"><div class="av" style="width:40px;height:40px;font-size:16px">${x.a}</div><div class="col f1" style="gap:2px"><b style="font-size:15px">${x.n}</b><span style="font-size:12px;color:var(--muted)">${x.t.split(" · ")[0]} · ${x.m} missions</span></div><b style="font:800 18px var(--fd)">${x.m*30} TND</b></div>`).join("")}`:`<div class="empty">Aucune preuve en attente. Les virements validés réactivent les comptes tout de suite.</div>`}</div>${tabbar("admin","payments")}</div>`;});
const USERS={a:[["A","Ahmed P.","Plombier · 4,9 ★ · 214 missions","Actif","b-ok",1],["K","Karim B.","Plombier · 4,8 ★","",0,1],["M","Mehdi S.","Électricien · 4,6 ★ · 88 missions","En pause","b-warn"],["H","Hatem R.","Climatisation · 4,7 ★ · 132 missions","Actif","b-ok"],["L","Lotfi M.","Serrurier · 3,1 ★","Suspendu","b-dng"]],
 c:[["S","Samir B.","La Marsa · 4 demandes","Actif","b-ok"],["A","Amel H.","Ariana · 2 demandes","Actif","b-ok"],["F","Firas D.","Lac 2 · 7 demandes","Actif","b-ok"],["N","Nour S.","Menzah 6 · 1 demande","Nouveau","b-mut"]]};

/* ---------- navigation ---------- */
function setRole(id){const g=META[id].g;if(g==="Client")S.role="client";else if(g==="Artisan")S.role="artisan";else if(g==="Admin")S.role="admin";}
function mount(id,how){clearAll();const old=app.querySelector(".scr:not(.leaving)");const wrap=document.createElement("div");wrap.innerHTML=SC[id].html();const el=wrap.firstElementChild;
 if(old)old.classList.add("leaving");app.appendChild(el);S.screen=id;if(location.hash.slice(1)!==id)history.replaceState(null,"","#"+id);
 if(old&&!reduce&&how!=="none"){let a,b;if(how==="fwd"){a=[{transform:"translateX(100%)"},{transform:"none"}];b=[{transform:"none",filter:"brightness(1)"},{transform:"translateX(-28%)",filter:"brightness(.85)"}];el.style.zIndex=2;}
  else if(how==="back"){const dx=S.dragX||0,f=dx/app.clientWidth;S.dragX=0;a=[{transform:`translateX(${-28*(1-f)}%)`,filter:`brightness(${.85+.15*f})`},{transform:"none",filter:"brightness(1)"}];b=[{transform:`translateX(${dx}px)`},{transform:"translateX(100%)"}];old.style.zIndex=2;}
  else if(how==="up"){a=[{transform:"translateY(40px)",opacity:0},{transform:"none",opacity:1}];b=[{opacity:1},{opacity:0}];el.style.zIndex=2;}
  else {a=[{opacity:0},{opacity:1}];b=[{opacity:1},{opacity:0}];el.style.zIndex=2;}
  const dur=how==="swap"?200:how==="tab"?250:how==="up"?400:350;el.animate(a,{duration:dur,easing:"cubic-bezier(.2,.8,.2,1)"});const an=old.animate(b,{duration:dur,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});an.onfinish=()=>old.remove();}
 else if(old)old.remove();
 if(SC[id].init)SC[id].init(el);skeleton(el,id);syncOffline();syncIndex();}
/* first visit of a list: show placeholders while it "loads" (longer when offline) */
function skeleton(el,id){const z=el.querySelector("[data-skel]");S.seen=S.seen||{};if(!z||(S.seen[id]&&!S.offline))return;S.seen[id]=1;
 z.classList.add("loading");z.insertAdjacentHTML("afterbegin",`<div class="skw col g10">${'<div class="row g12" style="padding:14px 0"><i class="sk" style="width:46px;height:46px;border-radius:14px"></i><span class="col f1 g8"><i class="sk" style="height:12px;width:60%"></i><i class="sk" style="height:10px;width:40%"></i></span></div>'.repeat(4)}</div>`);
 later(S.offline?2600:650,()=>{z.classList.remove("loading");const w=z.querySelector(".skw");if(w)w.remove();if(!reduce)[...z.children].forEach((c,i)=>c.animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:250,delay:i*40,easing:"ease-out",fill:"backwards"}));});}
function syncOffline(){let b=app.querySelector(".offb");if(S.offline&&!b){app.insertAdjacentHTML("beforeend",`<div class="offb" role="status"><span class="spinner" style="width:14px;height:14px;border-width:2px;border-color:rgba(255,255,255,.25);border-top-color:#A3E635"></span>Hors connexion</div>`);}
 else if(!S.offline&&b)b.remove();}
function go(id,how="fwd"){if(!SC[id])return;if(how==="fwd")S.hist.push(S.screen);setRole(id);mount(id,how);}
function back(){const p=S.hist.pop();if(p)mount(p,"back");else mount(S.role==="artisan"?"ahome":S.role==="admin"?"dash":"welcome","back");setRole(S.screen);}
function tabTo(id){S.hist=[];setRole(id);mount(id,"tab");}
/* iOS-style swipe from the left edge to go back */
(()=>{let sx=null,dx=0,cur=null;app.addEventListener("pointerdown",e=>{const r=app.getBoundingClientRect();if(e.clientX-r.left>18||!S.hist.length||app.querySelector(".bsheet"))return;
  cur=app.querySelector(".scr:not(.leaving)");if(!cur)return;sx=e.clientX;dx=0;app.setPointerCapture(e.pointerId);e.preventDefault();},true);
 app.addEventListener("pointermove",e=>{if(sx===null)return;dx=Math.max(0,e.clientX-sx);cur.style.transform=`translateX(${dx}px)`;cur.style.boxShadow="-12px 0 24px rgba(14,42,31,.18)";});
 const end=()=>{if(sx===null)return;sx=null;if(dx>app.clientWidth*.3){S.dragX=dx;cur.style.transform="";cur.style.boxShadow="";back();}else{cur.animate([{transform:`translateX(${dx}px)`},{transform:"none"}],{duration:250,easing:"cubic-bezier(.2,.8,.2,1)"});cur.style.transform="";cur.style.boxShadow="";}};
 app.addEventListener("pointerup",end,true);app.addEventListener("pointercancel",end,true);})();

/* ---------- actions ---------- */
function afterAuth(msg){S.hist=[];if(!S.located){go("locate","up");}else{go("home","up");later(350,()=>toast(msg));}}
const ACT={
 guest(){S.hist=["welcome"];if(!S.located)go("locate","up");else go("home","up");},
 allowLoc(b){const p=app.querySelector("#locpin");b.innerHTML='<span class="spinner" style="width:22px;height:22px;border-width:3px;border-color:rgba(255,255,255,.3);border-top-color:#A3E635"></span>Recherche de votre position…';
  if(p&&!reduce)p.animate([{transform:"scale(1)"},{transform:"scale(1.15)"},{transform:"scale(1)"}],{duration:600,iterations:2});later(1300,()=>{S.located=true;S.hist=[];mount("home","up");later(350,()=>toast("Position trouvée : La Marsa"));});},
 typeAddr(){S.located=true;S.hist=[];mount("home","up");later(350,()=>toast("Adresse : 12 Rue Habib Thameur, La Marsa"));},
 widen(){S.hist=[];setRole("search");mount("search","swap");later(300,()=>toast("Zone élargie à 15 km"));},
 upDoc(b){b.classList.add("on");b.querySelector(".ph").innerHTML=`<span class="col g6" style="align-items:center">${ic("check","#0D5C3A",22,3)}<span style="font:600 11px var(--fb);color:var(--forest)">Ajouté</span></span>`;
  if(!reduce)b.querySelector(".ph").animate([{transform:"scale(.92)"},{transform:"scale(1)"}],{duration:300,easing:"cubic-bezier(.2,.9,.3,1.4)"});const n=app.querySelectorAll(".up-tile.on").length;app.querySelector("#dcount").textContent=`${n} / 3`;const sb=app.querySelector("#dsend");sb.className="btn "+(n===3?"pri":"off");},
 sendDocs(b){if(b.classList.contains("off"))return;S.hist=[];go("docsent","up");haptic(14);},
 docsDone(){S.hist=[];go("ahome","up");later(350,()=>toast("Compte artisan créé · vérification en cours"));},
 openTab(b){go(b.dataset.to);},
 login(){const lp=app.querySelector("#lp");if(lp&&lp.value.length<6){lp.classList.add("bad");app.querySelector("#lerr").hidden=false;const d=app.querySelector(".door");if(d){d.classList.remove("shiver");void d.offsetWidth;d.classList.add("shiver");}haptic(30);return;}
  S.hist=[];afterAuth("Bon retour, Samir");},
 signup(){S.hist=[];if(S.signRole==="artisan"){go("docs","up");}else afterAuth("Bienvenue sur El 7al !");},
 eye(b){const i=b.parentElement.querySelector("input");i.type=i.type==="password"?"text":"password";},
 fpdone(){S.hist=[];mount("login","back");later(450,()=>toast("Mot de passe changé"));},
 launch(){S.sel=null;go("search","up");},
 probPhoto(){const l=app.querySelector("#phl"),a=app.querySelector("#pha"),i=app.querySelector("#phic");const on=a.textContent==="Ajouter";l.textContent=on?"1 photo ajoutée":"Aider l'artisan à venir équipé";a.textContent=on?"Retirer":"Ajouter";
  i.innerHTML=on?`<span style="width:40px;height:40px;border-radius:12px;background:linear-gradient(160deg,#C9D3C4,#93A396);display:block"></span>`:ic("cam","#0D5C3A",18,2);if(on&&!reduce)i.animate([{transform:"scale(.7)"},{transform:"scale(1)"}],{duration:300,easing:"cubic-bezier(.2,.9,.3,1.4)"});},
 arrival(){const a=app.querySelector("#arr");const o=["Dès que possible","Dans 1 heure","Ce soir · 18h–20h","Demain matin"];a.textContent=o[(o.indexOf(a.textContent)+1)%o.length];a.classList.remove("fadein");void a.offsetWidth;a.classList.add("fadein");},
 cancelSearch(){S.hist=[];S.active=false;mount("home","back");later(400,()=>toast("Demande annulée"));},
 cancelSheet(){cancelSheet();},
 closeSheet(){app.querySelectorAll(".veil,.bsheet").forEach(x=>x.remove());},
 doCancel(){S.hist=[];S.sel=null;S.active=false;mount("home","back");later(400,()=>toast("Demande annulée · Ahmed est prévenu"));},
 paid(){confetti();haptic(20);S.sel=null;S.active=false;later(1300,()=>{S.hist=[];mount("home","up");later(300,()=>toast("Merci ! Paiement confirmé"));});},
 photo(){sendMsg("",true);},
 notif(b){S.notif=!S.notif;b.querySelector(".toggle").classList.toggle("on",S.notif);b.setAttribute("aria-checked",String(S.notif));},
 logout(){S.hist=[];S.onb=0;mount("welcome","back");},
 delAcc(){const el=app.querySelector(".scr");el.insertAdjacentHTML("beforeend",`<div class="veil" data-act="closeSheet"></div><div class="bsheet" role="dialog" aria-label="Supprimer le compte"><span class="grab"></span><h2 class="h1" style="font-size:26px">Supprimer le compte ?</h2><p class="sub" style="font-size:14px">Votre historique et vos adresses seront effacés. Cette action est définitive.</p><div class="row g10"><button class="btn pri sm" data-act="closeSheet">Garder mon compte</button><button class="btn dng sm" data-act="logout">Supprimer</button></div></div>`);},
 readAll(){app.querySelectorAll(".nf").forEach(n=>{n.style.background="transparent";n.style.borderColor="transparent";});toast("Tout est lu");},
 online(){if(S.dues!=="ok"){go(S.dues==="refused"?"refused":"pause");return;}S.online=!S.online;go("ahome","swap");},
 acceptReq(){S.mstep=0;S.reqGone=true;S.inMission=true;haptic(14);go("mission");later(5000,()=>{S.reqGone=false;});},
 refuseReq(){S.reqGone=true;refreshReq(app.querySelector(".scr"));later(5000,()=>{S.reqGone=false;const el=app.querySelector(".scr");if(S.screen==="ahome")refreshReq(el);});},
 missionDone(){S.missions++;S.inMission=false;S.amount="85";S.hist=[];mount("ahome","up");later(400,()=>toast(`+1 mission · ${S.missions*30} TND à régler`));},
 copyRib(){const t="TN59 0000 0000 0000 0000 0000";try{navigator.clipboard.writeText(t).then(()=>toast("RIB copié"),()=>toast("RIB : "+t));}catch(e){toast("RIB : "+t);}},
 sendProof(){if(!S.proofSet){toast("Ajoutez la photo du virement");return;}S.dues="pending";S.dueMissions=S.missions;S.lastDue=S.missions*30;S.hist=[];go("pause","up");},
 resend(){S.proofSet=false;go("pay");},
 toAdmin(){S.hist=[];setRole("payments");mount("payments","fade");toast("Vous êtes l'admin");},
 pOk(){const l=pendingProofs();const p=l[0];if(p.me){S.dues="ok";S.missions=0;S.proofSet=false;}else S.proofs=S.proofs.filter(x=>x!==p);go("payments","swap");toast(`${p.n} réactivé`);},
 pRefuse(){const l=pendingProofs();const p=l[0];if(p.me){S.dues="refused";}else S.proofs=S.proofs.filter(x=>x!==p);go("payments","swap");toast(`Preuve de ${p.n} refusée`);},
 vOk(){const v=S.verifs.shift();go("verifs","swap");toast(`${v.n} est vérifié`);},
 vRefuse(){const v=S.verifs.shift();go("verifs","swap");toast(`Dossier de ${v.n} refusé`);},
 trade(b){b.classList.toggle("on");}
};
app.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-act],[data-back],[data-tab],[data-sel],[data-toast],[data-star],[data-reason]");if(!t||!app.contains(t))return;
 if(t.dataset.back!==undefined){back();return;}
 if(t.dataset.go){e.preventDefault();go(t.dataset.go);return;}
 if(t.dataset.tab){e.preventDefault();if(t.dataset.tab!==S.screen)tabTo(t.dataset.tab);return;}
 if(t.dataset.sel!==undefined){selectBox(+t.dataset.sel);return;}
 if(t.dataset.star){S.stars=+t.dataset.star;app.querySelectorAll("[data-star]").forEach(b=>{const n=+b.dataset.star;b.innerHTML=STAR(n<=S.stars?"#0D5C3A":"#DAE1D3");b.setAttribute("aria-checked",String(n===S.stars));if(n<=S.stars){b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");}});return;}
 if(t.dataset.reason){S.reason=+t.dataset.reason;app.querySelectorAll("[data-reason]").forEach(b=>b.classList.toggle("on",b===t));return;}
 if(t.dataset.act&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t,e);return;}
 if(t.dataset.toast){toast(t.dataset.toast);}});

/* ---------- index ---------- */
const ORDER=["welcome","login","signup","fp1","fp2","fp3","locate","home","problem","search","searchnone","track","end","requests","messages","chat","profile","notifs","docs","docsent","ahome","mlist","mission","amount","pay","pause","refused","aprofile","dash","verifs","payments","users"];
function buildIndex(){const g={};ORDER.forEach(id=>{(g[META[id].g]=g[META[id].g]||[]).push(id);});
 document.getElementById("idxlist").innerHTML=Object.entries(g).map(([k,ids])=>`<h3>${k}</h3>${ids.map(id=>`<button data-jump="${id}">${META[id].t}</button>`).join("")}`).join("")+
  `<h3>Démo</h3><button id="offt" aria-pressed="false">Simuler : pas de connexion</button>`;
 document.getElementById("offt").addEventListener("click",e=>{e.stopPropagation();S.offline=!S.offline;e.currentTarget.setAttribute("aria-current",String(S.offline));e.currentTarget.setAttribute("aria-pressed",String(S.offline));e.currentTarget.textContent=S.offline?"Rétablir la connexion":"Simuler : pas de connexion";syncOffline();if(!S.offline)toast("Connexion rétablie");});
 document.getElementById("idxlist").addEventListener("click",e=>{const b=e.target.closest("[data-jump]");if(!b)return;const id=b.dataset.jump;
  if(id==="pause"&&S.dues==="ok"){S.dues="pending";S.lastDue=S.missions*30;S.dueMissions=S.missions;}if(id==="refused"){S.dues="refused";S.lastDue=S.lastDue||S.missions*30;}
  S.hist=[];setRole(id);mount(id,"fade");document.getElementById("index").classList.remove("open");});}
function syncIndex(){document.querySelectorAll("[data-jump]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.jump===S.screen)));}
document.getElementById("idxbtn").addEventListener("click",()=>document.getElementById("index").classList.add("open"));
document.querySelector("[data-idx-close]").addEventListener("click",()=>document.getElementById("index").classList.remove("open"));

/* ---------- fit phone ---------- */
function fit(){const slot=document.getElementById("slot"),ph=document.getElementById("phone");if(matchMedia("(max-width:760px)").matches){slot.style.width="";slot.style.height="";ph.style.transform="";return;}
 const s=Math.min(1,(innerHeight-40)/864,(innerWidth-(innerWidth>1000?330:40))/410);ph.style.transform=`scale(${s})`;slot.style.width=410*s+"px";slot.style.height=864*s+"px";}
addEventListener("resize",fit);fit();buildIndex();
const start=location.hash.slice(1);const first=SC[start]?start:"welcome";if(first==="pause"){S.dues="pending";}if(first==="refused"){S.dues="refused";}setRole(first);mount(first,"none");
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(SC[h]&&h!==S.screen){S.hist=[];setRole(h);mount(h,"fade");}});
})();
