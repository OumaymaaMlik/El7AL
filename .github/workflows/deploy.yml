name: Deploy

# Runs after the CI workflow finishes successfully on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deployments at the same time; a new one waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the VPS
    # Skip when CI failed; always allow a manual run.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      # The exact commit CI tested (manual runs deploy the latest main).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Update the code and restart the containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /opt/el7al
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
            docker image prune -f

      - name: Check that the API answers
        if: vars.API_DOMAIN != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/api/v1/health"; then
              echo; echo "API is healthy"; exit 0
            fi
            echo "Waiting for the API ($i/30)..."
            sleep 10
          done
          echo "The API did not become healthy in 5 minutes"
          exit 1
