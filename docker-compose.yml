version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 + PostGIS Spatial Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: el7al-postgres
    restart: always
    environment:
      POSTGRES_USER: el7al_admin
      POSTGRES_PASSWORD: el7al_db_password_2026
      POSTGRES_DB: el7al_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U el7al_admin -d el7al_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis 7 (Cache, Geo Indexing, BullMQ Task Queues & Socket PubSub)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: el7al-redis
    restart: always
    command: redis-server --requirepass el7al_redis_password_2026
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a el7al_redis_password_2026 ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. MinIO (S3-Compatible Object Storage for Documents & Images)
  # ---------------------------------------------------------------------------
  minio:
    # minio/minio left Docker Hub; this is the maintained MinIO build (pinned by digest).
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    user: "0:0"
    container_name: el7al-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_2026
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - miniodata:/data

  # ---------------------------------------------------------------------------
  # 4. Prometheus (Time-Series Metrics Collection Engine)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: el7al-prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"

  # ---------------------------------------------------------------------------
  # 5. Grafana (Centralized Visual Dashboards & Analytics)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: el7al-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_password_2026
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # 6. Grafana Loki (Log Aggregation Service)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: el7al-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
  lokidata:
